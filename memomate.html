<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>memomate</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#f5f5f7; --card:#fff; --text:#1d1d1f; --sub:#6e6e73; --line:#e3e3e8;
  --accent:#0071e3; --accent-text:#0066cc; --danger:#d70015; --fill:#ececf0; --nav:rgba(251,251,253,.8);
  --ev:#e6f1fd; --ev-text:#0058b0; --shadow:0 2px 12px rgba(0,0,0,.05);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#000; --card:#1c1c1e; --text:#f5f5f7; --sub:#a1a1a6; --line:#323236;
  --accent:#0a84ff; --accent-text:#4aa8ff; --danger:#ff6961; --fill:#2c2c2e; --nav:rgba(22,22,23,.8);
  --ev:#102b47; --ev-text:#8cc5ff; --shadow:none;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=search],input[type=date],input[type=time],select,textarea{background:var(--fill);border:1px solid transparent;border-radius:10px;padding:8px 12px;min-width:0;max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none;cursor:pointer}

header{position:sticky;top:0;z-index:10;background:var(--nav);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.bar{max-width:1100px;margin:0 auto;height:52px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-weight:600;font-size:18px}
nav{display:flex;gap:4px}
nav a{color:var(--sub);text-decoration:none;font-size:14px;padding:6px 14px;border-radius:980px;white-space:nowrap}
nav a:hover{color:var(--text)}
nav a[aria-current]{background:var(--text);color:var(--bg)}
.iconbtn{padding:6px 12px;border-radius:980px;color:var(--accent-text);white-space:nowrap}
.iconbtn:hover{background:var(--fill)}
main{max-width:1100px;margin:0 auto;padding:32px 20px 80px}

h1{font-size:40px;line-height:1.15;font-weight:700;letter-spacing:-.025em}
h2{font-size:19px;font-weight:600}
.lead{color:var(--sub);font-size:19px;margin-top:6px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.card{background:var(--card);border-radius:18px;padding:20px;box-shadow:var(--shadow);min-width:0}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--sub);font-size:13px}
.empty{color:var(--sub);padding:20px 0;text-align:center;font-size:14px}
.btn{background:var(--accent);color:#fff;border-radius:980px;padding:8px 18px;font-size:14px;white-space:nowrap}
.btn:hover{filter:brightness(1.1)}
.btn.sec{background:var(--fill);color:var(--text)}
.btn.danger{background:var(--danger);color:#fff}
:root[data-theme="dark"] .btn.danger{color:#000}
.link{color:var(--accent-text);font-size:14px;padding:2px 6px;white-space:nowrap}
.link.danger{color:var(--danger)}
.seg{display:inline-flex;background:var(--fill);border-radius:10px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{padding:5px 14px;border-radius:8px;font-size:14px;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.15);font-weight:600}

.item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item input[type=checkbox]{margin-top:1px}
.item.sub{padding-left:30px}
.item .main{flex:1;min-width:0;text-align:left;display:block;width:100%}
.item .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--sub)}
.item.done .ttl{text-decoration:line-through;color:var(--sub)}
.item.late .ttl,.item.late .meta,.late-text{color:var(--danger)}
.pri{font-weight:600}
.pri.high{color:var(--danger)}
.pri.medium{color:var(--accent-text)}

/* 메모 */
.memo-layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start}
.memo-list{display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 290px);overflow-y:auto;padding:2px}
.memo-card{display:block;width:100%;text-align:left;background:var(--card);border-radius:14px;padding:12px 14px;border:2px solid transparent;border-left:6px solid transparent;flex:none}
.memo-card.on{border-top-color:var(--accent);border-right-color:var(--accent);border-bottom-color:var(--accent)}
.memo-card strong,.memo-card p{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.memo-card p{color:var(--sub);font-size:13px}
.c-red{border-left-color:#ff453a!important}.c-orange{border-left-color:#ff9f0a!important}.c-yellow{border-left-color:#ffd60a!important}
.c-green{border-left-color:#30d158!important}.c-blue{border-left-color:#0a84ff!important}.c-purple{border-left-color:#bf5af2!important}
.swatch{width:24px;height:24px;border-radius:50%;border:2px solid var(--line)}
.swatch[aria-pressed=true]{outline:2px solid var(--text);outline-offset:2px}
.editor{display:flex;flex-direction:column;gap:12px;min-height:520px}
.editor .title{font-size:26px;font-weight:700;background:none;border:0;padding:0}
.editor textarea{min-height:320px;resize:vertical;background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:12px 0;line-height:1.7}
.editor textarea:focus{border-color:var(--accent)}
.back{display:none;align-self:flex-start}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--fill);border-radius:980px;padding:3px 12px;font-size:13px}
.chip[aria-pressed=true]{background:var(--accent);color:#fff}

/* 캘린더 */
.cal-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow{text-align:center;font-size:12px;color:var(--sub);padding:6px 0}
.day{border-top:1px solid var(--line);min-height:104px;padding:4px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;overflow:hidden}
.day:hover{background:var(--fill)}
.day.other{opacity:.38}
.day.sel{background:var(--fill);box-shadow:inset 0 0 0 2px var(--accent)}
.num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;flex:none}
.sun,.hol{color:var(--danger)}
.sat{color:var(--accent-text)}
.today .num{background:var(--accent);color:#fff;font-weight:700}
.hname{font-size:11px;color:var(--danger);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:block;font-size:11px;line-height:1.6;border-radius:5px;padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--ev);color:var(--ev-text)}
.tag.todo{background:var(--fill);color:var(--text)}
.tag.todo.late{color:var(--danger)}
.tag.todo.done{text-decoration:line-through;color:var(--sub)}
.tag.memo{background:none;color:var(--sub)}
.week{display:flex;flex-direction:column}
.week .day{min-height:68px;flex-direction:row;gap:12px;align-items:flex-start;padding:10px 4px}
.week .when{width:52px;flex:none;display:flex;flex-direction:column;align-items:center;font-size:12px}
.week .what{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.week .tag{font-size:13px}
.section{margin-top:14px}
.section h3{font-size:13px;color:var(--sub);display:flex;justify-content:space-between;align-items:center}

dialog{border:0;border-radius:18px;padding:22px;width:min(460px,calc(100vw - 28px));max-height:85vh;background:var(--card);color:var(--text);margin:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog form{display:flex;flex-direction:column;gap:12px}
dialog label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--sub)}
dialog label input,dialog label select,dialog label textarea{color:var(--text);font-size:15px;width:100%}
dialog label.inline{flex-direction:row;align-items:center;gap:8px}
dialog label.inline input{width:20px}
dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:980px;font-size:14px;z-index:30;width:max-content;max-width:90vw;pointer-events:none}

@media (max-width:860px){
  .cal-layout{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  header{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}
  nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:20;gap:0}
  nav a{padding:6px 10px}
  main{padding:20px 16px 100px}
  h1{font-size:30px}
  .lead{font-size:16px}
  .grid{grid-template-columns:minmax(0,1fr)}
  .memo-layout{grid-template-columns:minmax(0,1fr)}
  .memo-layout .editor{display:none}
  .memo-layout.editing .editor{display:flex}
  .memo-layout.editing .side{display:none}
  .memo-list{max-height:none}
  .back{display:block}
  .seg button{padding:5px 10px}
  .editor .row input[type=text]{flex:1 1 100%}
  form.card .grow{flex-basis:100%}
  .cal-card{padding:10px 6px}
  .month .day{min-height:62px;padding:2px;align-items:center}
  .month .hname{font-size:9px;max-width:100%}
  .month .tags{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
  .month .tag{width:6px;height:6px;border-radius:50%;padding:0;font-size:0;background:var(--accent)}
  .month .tag.todo{background:var(--sub)}
  .month .tag.todo.late{background:var(--danger)}
  .month .tag.memo{background:#ff9f0a}
  .month .more{display:none}
  input[type=text],input[type=search],input[type=date],input[type=time],select,textarea,dialog label input,dialog label select,dialog label textarea{font-size:16px}
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <span class="logo">memomate</span>
    <nav aria-label="주 메뉴">
      <a href="#today">오늘</a><a href="#memo">메모</a><a href="#todo">할 일</a><a href="#calendar">캘린더</a><a href="#settings">설정</a>
    </nav>
    <button class="iconbtn" id="searchBtn" type="button">검색</button>
  </div>
</header>
<main id="app"></main>
<div id="toast" role="status" hidden></div>

<script>
'use strict';

/* ───────── 저장 계층 ───────── */
const KEYS = { memos:'memomate.memos', todos:'memomate.todos', events:'memomate.events', settings:'memomate.settings' };
const VERSION = 1;
const COLORS = ['', 'red', 'orange', 'yellow', 'green', 'blue', 'purple'];
const COLOR_NAMES = { '':'색 없음', red:'빨강', orange:'주황', yellow:'노랑', green:'초록', blue:'파랑', purple:'보라' };
const PRI = { high:'상', medium:'중', low:'하' };
const REPEAT = { daily:'매일', weekly:'매주', monthly:'매월' };

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const nowIso = () => new Date().toISOString(); // 타임스탬프 전용. 날짜 계산에는 ymd() 사용

/* ───────── 날짜 유틸 (모두 로컬 시간) ───────── */
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const daysInMonth = (y, m) => new Date(y, m + 1, 0).getDate();
const WD = ['일', '월', '화', '수', '목', '금', '토'];
const fmtDate = s => { const d = parseYmd(s); const y = d.getFullYear() !== new Date().getFullYear() ? `${d.getFullYear()}년 ` : ''; return `${y}${d.getMonth() + 1}월 ${d.getDate()}일 (${WD[d.getDay()]})`; };
const fmtStamp = iso => { const d = new Date(iso); return isNaN(d) ? '' : `${ymd(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const isDate = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && ymd(parseYmd(s)) === s;
const isDateTime = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}T([01]\d|2[0-3]):[0-5]\d$/.test(s) && isDate(s.slice(0, 10));

/* ───────── 한국 공휴일 (2025~2027) ─────────
   관공서 공휴일·대체공휴일·임시공휴일·선거일을 직접 입력한 정적 데이터.
   웹 검색 자료 기준이며 법령 원문과 대조하지 않았음. 2028년 이후는 포함되지 않음. */
const HOLIDAYS = {
  2025: { '01-01':'신정', '01-27':'임시공휴일', '01-28':'설날 연휴', '01-29':'설날', '01-30':'설날 연휴', '03-01':'삼일절', '03-03':'대체공휴일', '05-05':'어린이날·부처님오신날', '05-06':'대체공휴일', '06-03':'대통령 선거일', '06-06':'현충일', '08-15':'광복절', '10-03':'개천절', '10-05':'추석 연휴', '10-06':'추석', '10-07':'추석 연휴', '10-08':'대체공휴일', '10-09':'한글날', '12-25':'성탄절' },
  2026: { '01-01':'신정', '02-16':'설날 연휴', '02-17':'설날', '02-18':'설날 연휴', '03-01':'삼일절', '03-02':'대체공휴일', '05-01':'노동절', '05-05':'어린이날', '05-24':'부처님오신날', '05-25':'대체공휴일', '06-03':'지방선거일', '06-06':'현충일', '07-17':'제헌절', '08-15':'광복절', '08-17':'대체공휴일', '09-24':'추석 연휴', '09-25':'추석', '09-26':'추석 연휴', '10-03':'개천절', '10-05':'대체공휴일', '10-09':'한글날', '12-25':'성탄절' },
  2027: { '01-01':'신정', '02-06':'설날 연휴', '02-07':'설날', '02-08':'설날 연휴', '02-09':'대체공휴일', '03-01':'삼일절', '05-01':'노동절', '05-03':'대체공휴일', '05-05':'어린이날', '05-13':'부처님오신날', '06-06':'현충일', '07-17':'제헌절', '07-19':'대체공휴일', '08-15':'광복절', '08-16':'대체공휴일', '09-14':'추석 연휴', '09-15':'추석', '09-16':'추석 연휴', '10-03':'개천절', '10-04':'대체공휴일', '10-09':'한글날', '10-11':'대체공휴일', '12-25':'성탄절', '12-27':'대체공휴일' }
};
const holiday = s => HOLIDAYS[s.slice(0, 4)]?.[s.slice(5)] || '';

/* ───────── 데이터 정규화 (저장소·가져오기 공용) ───────── */
const str = v => typeof v === 'string' ? v : '';
const opt = v => typeof v === 'string' && v ? v : null;
const stamp = v => typeof v === 'string' && !isNaN(Date.parse(v)) ? v : nowIso();
const normalize = {
  memos: m => ({ id:str(m.id) || uid(), title:str(m.title), body:str(m.body), tags:Array.isArray(m.tags) ? m.tags.filter(t => typeof t === 'string' && t) : [], folder:str(m.folder), pinned:!!m.pinned, color:COLORS.includes(m.color) ? m.color : '', date:isDate(m.date) ? m.date : null, aiExcluded:!!m.aiExcluded, createdAt:stamp(m.createdAt), updatedAt:stamp(m.updatedAt), deletedAt:opt(m.deletedAt) }),
  todos: t => ({ id:str(t.id) || uid(), title:str(t.title), done:!!t.done, due:isDate(t.due) ? t.due : null, priority:Object.hasOwn(PRI, t.priority) ? t.priority : 'medium', parentId:opt(t.parentId), repeat:Object.hasOwn(REPEAT, t.repeat) ? t.repeat : null, repeatDay:Number.isInteger(t.repeatDay) ? t.repeatDay : null, spawned:!!t.spawned, memoId:opt(t.memoId), memoOrder:Number.isInteger(t.memoOrder) ? t.memoOrder : null, createdAt:stamp(t.createdAt), updatedAt:stamp(t.updatedAt) }),
  events: e => {
    const allDay = !!e.allDay, ok = allDay ? isDate : isDateTime;
    if (!ok(e.start)) return null;
    return { id:str(e.id) || uid(), title:str(e.title), start:e.start, end:ok(e.end) && e.end >= e.start ? e.end : null, allDay, note:str(e.note), createdAt:stamp(e.createdAt), updatedAt:stamp(e.updatedAt) };
  }
};
const cleanList = (kind, list) => list.filter(x => x && typeof x === 'object').map(normalize[kind]).filter(Boolean);

const state = { memos:[], todos:[], events:[], settings:{ theme:'system', lastExport:null } };
let loadProblem = false;

function readKey(key) {
  let raw = null;
  try {
    raw = localStorage.getItem(key);
    return raw === null ? null : JSON.parse(raw);
  } catch {
    loadProblem = true;
    // 손상된 원본은 덮어쓰기 전에 따로 보관
    try { if (raw !== null) localStorage.setItem(key + '.corrupt', raw); } catch {}
    return null;
  }
}
function load() {
  for (const kind of ['memos', 'todos', 'events']) {
    const data = readKey(KEYS[kind]);
    state[kind] = Array.isArray(data) ? cleanList(kind, data) : [];
  }
  const s = readKey(KEYS.settings) || {};
  state.settings = { theme:['system', 'light', 'dark'].includes(s.theme) ? s.theme : 'system', lastExport:opt(s.lastExport) };
}
function save(...kinds) {
  try {
    for (const k of kinds) localStorage.setItem(KEYS[k], JSON.stringify(state[k]));
    return true;
  } catch {
    toast('저장하지 못했습니다. 브라우저 저장 공간을 확인하고 설정에서 백업해 주세요.');
    return false;
  }
}

/* ───────── DOM 도우미 (innerHTML을 쓰지 않아 입력값이 코드로 실행되지 않음) ───────── */
function h(tag, props, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else if (k === 'value' || k === 'checked') el[k] = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat(Infinity)) if (c !== null && c !== undefined && c !== false && c !== '') el.append(c);
  if (tag === 'select' && props?.value !== undefined) el.value = props.value;
  return el;
}
const btn = (label, onclick, cls = 'btn', extra = {}) => h('button', { type:'button', class:cls, onclick, ...extra }, label);
const empty = text => h('p', { class:'empty' }, text);
const field = (label, control) => h('label', null, label, control);
const options = map => Object.entries(map).map(([v, l]) => h('option', { value:v }, l));
const $app = document.getElementById('app');

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer);

/* ───────── 메모 ↔ 할 일 연결 (체크박스 문법) ───────── */
const TASK_RE = /^(\s*[-*]\s*\[)([ xX]?)(\]\s*)(.*)$/;
function parseTasks(body) {
  const out = [];
  body.split('\n').forEach((line, i) => {
    const m = TASK_RE.exec(line);
    if (m && m[4].trim()) out.push({ line:i, done:m[2].toLowerCase() === 'x', title:m[4].trim() });
  });
  return out;
}
const memoById = id => state.memos.find(m => m.id === id);
const linkedTodos = memoId => state.todos.filter(t => t.memoId === memoId && t.memoOrder !== null).sort((a, b) => a.memoOrder - b.memoOrder);

function syncMemoTodos(memo) {
  const tasks = parseTasks(memo.body);
  const rest = linkedTodos(memo.id);
  // 1) 제목이 같은 항목끼리 먼저 연결, 2) 남은 것은 순서대로 연결(제목 수정으로 간주)
  const matched = tasks.map(task => {
    const i = rest.findIndex(t => t.title === task.title);
    return i < 0 ? null : rest.splice(i, 1)[0];
  });
  let changed = false;
  tasks.forEach((task, order) => {
    let todo = matched[order] || rest.shift();
    if (!todo) {
      todo = normalize.todos({ title:task.title, memoId:memo.id });
      state.todos.push(todo);
      changed = true;
    }
    if (todo.title !== task.title || todo.done !== task.done || todo.memoOrder !== order) {
      todo.title = task.title; todo.memoOrder = order; todo.updatedAt = nowIso();
      if (todo.done !== task.done) setDone(todo, task.done);
      changed = true;
    }
  });
  if (rest.length) {
    const gone = new Set(rest.map(t => t.id));
    state.todos = state.todos.filter(t => !gone.has(t.id) && !gone.has(t.parentId));
    changed = true;
  }
  if (changed) save('todos');
}
let pendingSync = null, syncTimer;
function scheduleSync(memoId) {
  if (pendingSync && pendingSync !== memoId) flushSync();
  pendingSync = memoId;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(flushSync, 800);
}
function flushSync() {
  clearTimeout(syncTimer);
  const memo = pendingSync && memoById(pendingSync);
  pendingSync = null;
  if (memo) syncMemoTodos(memo);
}
// 할 일 쪽 변경을 메모 본문의 해당 줄에 반영 (todo = null 이면 줄 삭제)
function writeBackToMemo(source, change) {
  const memo = source.memoId && source.memoOrder !== null && memoById(source.memoId);
  if (!memo) return;
  const task = parseTasks(memo.body)[source.memoOrder];
  if (!task) return;
  const lines = memo.body.split('\n');
  if (change === null) {
    lines.splice(task.line, 1);
    linkedTodos(memo.id).forEach(t => { if (t.memoOrder > source.memoOrder) t.memoOrder--; });
  } else {
    lines[task.line] = lines[task.line].replace(TASK_RE, (_, a, _mark, c) => `${a}${change.done ? 'x' : ' '}${c.endsWith(' ') ? c : c + ' '}${change.title}`);
  }
  memo.body = lines.join('\n');
  memo.updatedAt = nowIso();
  save('memos');
}

/* ───────── 할 일 로직 ───────── */
function nextDue(todo) {
  if (todo.repeat === 'daily') return addDays(todo.due, 1);
  if (todo.repeat === 'weekly') return addDays(todo.due, 7);
  const d = parseYmd(todo.due);
  const y = d.getFullYear(), m = d.getMonth() + 1;
  const first = new Date(y, m, 1);
  const day = Math.min(todo.repeatDay || d.getDate(), daysInMonth(first.getFullYear(), first.getMonth()));
  return ymd(new Date(first.getFullYear(), first.getMonth(), day));
}
function setDone(todo, done) {
  todo.done = done;
  todo.updatedAt = nowIso();
  if (done && todo.repeat && todo.due && !todo.spawned) {
    todo.spawned = true; // 다음 회차는 한 번만 생성
    const next = normalize.todos({ title:todo.title, priority:todo.priority, due:nextDue(todo), repeat:todo.repeat, repeatDay:todo.repeatDay });
    state.todos.push(next);
    state.todos.filter(t => t.parentId === todo.id).forEach(c =>
      state.todos.push(normalize.todos({ title:c.title, priority:c.priority, parentId:next.id })));
    toast(`다음 반복 일정: ${fmtDate(next.due)}`);
  }
}

  const todo = state.todos.find(t => t.id === id);

  setDone(todo, done);
  writeBackToMemo(todo, todo);
  save('todos');
  render();
}
function deleteTodo(id) {

  if (!todo) return;
  const gone = [todo, ...state.todos.filter(t => t.parentId === id)];
  gone.forEach(t => {
    writeBackToMemo(t, null);
    state.todos = state.todos.filter(x => x !== t);
  });
  save('todos');
  render();
}
const isLate = t => !t.done && !!t.due && t.due < today();
const priRank = { high:0, medium:1, low:2 };
const byTodo = (a, b) => (a.done - b.done) || (a.due || '9999').localeCompare(b.due || '9999') || (priRank[a.priority] - priRank[b.priority]) || a.createdAt.localeCompare(b.createdAt);

function addTodo(data) {

  if (todo.repeat && !todo.due) todo.due = today();
  if (todo.repeat) todo.repeatDay = parseYmd(todo.due).getDate();
  state.todos.push(todo);
  save('todos');
}

function viewTodo() {
  const title = h('input', { type:'text', class:'grow', placeholder:'할 일 입력', 'aria-label':'새 할 일 제목', maxlength:300, required:true });
  const due = h('input', { type:'date', 'aria-label':'마감일', value:todoUI.filter === 'today' ? today() : '' });

  const test = TODO_FILTERS[todoUI.filter][1];

  const ids = new Set(state.todos.map(t => t.id));
  const shown = new Set(matches.map(t => t.id));
  const children = new Map();
  state.todos.forEach(t => { if (t.parentId) (children.get(t.parentId) || children.set(t.parentId, []).get(t.parentId)).push(t); });
  // 상위 항목이 목록에 있으면 하위 항목은 그 아래에만 표시
  const roots = matches.filter(t => !t.parentId || !ids.has(t.parentId) || !shown.has(t.parentId)).sort(byTodo);
  const rows = [];

    (children.get(t.id) || []).sort((a, b) => a.createdAt.localeCompare(b.createdAt)).forEach(c => rows.push(todoItem(c, { sub:true })));

  if (roots.length > todoUI.limit) rows.push(btn(`더 보기 (${roots.length - todoUI.limit}개 남음)`, () => { todoUI.limit += 300; render(); }, 'link'));

const calUI = { mode:'month', selected:today() };

function indexByDate(from, to) {
  const map = new Map();
  for (let d = from; d <= to; d = addDays(d, 1)) map.set(d, []);
  for (const e of [...state.events].sort((a, b) => (b.allDay - a.allDay) || a.start.localeCompare(b.start))) {
    const first = eventStartDay(e) > from ? eventStartDay(e) : from;
    const last = eventEndDay(e) < to ? eventEndDay(e) : to;
    for (let d = first; d <= last; d = addDays(d, 1)) map.get(d).push({ cls:'', text:(e.allDay || eventStartDay(e) !== d ? '' : e.start.slice(11) + ' ') + e.title });
  }
  for (const t of state.todos) if (map.has(t.due)) map.get(t.due).push({ cls:`todo${t.done ? ' done' : ''}${isLate(t) ? ' late' : ''}`, text:`${t.done ? '✓' : '○'} ${t.title}` });
  for (const m of activeMemos()) if (map.has(m.date)) map.get(m.date).push({ cls:'memo', text:`✎ ${m.title || '제목 없음'}` });
  return map;
}
function dayClass(d) {
  const wd = parseYmd(d).getDay();
  return holiday(d) || wd === 0 ? 'sun' : wd === 6 ? 'sat' : '';
}
function pickDay(d) { calUI.selected = d; render(); $app.querySelector(`.day[data-date="${d}"]`)?.focus({ preventScroll:true }); }
function dayProps(d, extra) {

    type:'button', 'data-date':d,
    class:`day${d === today() ? ' today' : ''}${d === calUI.selected ? ' sel' : ''}${extra.other ? ' other' : ''}`,
    'aria-label':`${fmtDate(d)}${holiday(d) ? ' ' + holiday(d) : ''}, 항목 ${count}개`,
    onclick:() => pickDay(d)

}

function calendarGrid() {
  const sel = parseYmd(calUI.selected);
  if (calUI.mode === 'week') {
    const start = addDays(calUI.selected, -sel.getDay());
    const map = indexByDate(start, addDays(start, 6));
    return h('div', { class:'week' }, [...map].map(([d, items]) =>
      h('button', dayProps(d, { count:items.length }),
        h('span', { class:'when' }, h('span', { class:dayClass(d) }, WD[parseYmd(d).getDay()]), h('span', { class:`num ${dayClass(d)}` }, String(parseYmd(d).getDate()))),
        h('span', { class:'what' },
          holiday(d) && h('span', { class:'hname' }, holiday(d)),
          items.map(i => h('span', { class:`tag ${i.cls}` }, i.text))))));
  }
  const y = sel.getFullYear(), m = sel.getMonth();
  const offset = new Date(y, m, 1).getDay();
  const cells = Math.ceil((offset + daysInMonth(y, m)) / 7) * 7;
  const start = ymd(new Date(y, m, 1 - offset));
  const map = indexByDate(start, addDays(start, cells - 1));
  return h('div', { class:'month' },
    WD.map((w, i) => h('div', { class:`dow${i === 0 ? ' sun' : i === 6 ? ' sat' : ''}` }, w)),
    [...map].map(([d, items]) =>

}

function shiftCalendar(step) {
  if (calUI.mode === 'week') calUI.selected = addDays(calUI.selected, 7 * step);
  else {
    const d = parseYmd(calUI.selected);
    const first = new Date(d.getFullYear(), d.getMonth() + step, 1);
    calUI.selected = ymd(new Date(first.getFullYear(), first.getMonth(), Math.min(d.getDate(), daysInMonth(first.getFullYear(), first.getMonth()))));
  }
  render();
}

    label = `${s.getMonth() + 1}월 ${s.getDate()}일 – ${e.getMonth() + 1}월 ${e.getDate()}일`;

function exportData() {
  flushSync();
  const data = { app:'memomate', version:VERSION, exportedAt:nowIso(), memos:state.memos, todos:state.todos, events:state.events };
  const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type:'application/json' }));
  const a = h('a', { href:url, download:`memomate-backup-${today().replaceAll('-', '')}.json` });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  state.settings.lastExport = nowIso();
  save('settings');
  render();
}
function parseBackup(text) {
  let data;
  try { data = JSON.parse(text); } catch { throw new Error('JSON 형식이 아닙니다.'); }
  if (!data || data.app !== 'memomate' || !Number.isInteger(data.version)) throw new Error('memomate 백업 파일이 아닙니다.');
  if (data.version > VERSION) throw new Error('더 새로운 버전의 백업 파일이라 불러올 수 없습니다.');
  const out = {};
  for (const kind of ['memos', 'todos', 'events']) {
    if (!Array.isArray(data[kind])) throw new Error('백업 파일의 구조가 올바르지 않습니다.');
    out[kind] = cleanList(kind, data[kind]);
    if (out[kind].length !== data[kind].length) throw new Error('백업 파일에 손상된 항목이 있어 불러오지 않았습니다.');
  }
  return out;
}
function applyBackup(data) {
  flushSync();
  const before = { memos:state.memos, todos:state.todos, events:state.events };
  Object.assign(state, data);
  if (!save('memos', 'todos', 'events')) { Object.assign(state, before); save('memos', 'todos', 'events'); return; }
  memoUI.selected = null; memoUI.filter = null;
  render();
  toast('백업을 불러왔습니다.');
}
async function importFile(file) {
  try {
    const data = parseBackup(await file.text());
    ask(`현재 데이터를 모두 덮어씁니다. 파일 내용: 메모 ${data.memos.length}개, 할 일 ${data.todos.length}개, 일정 ${data.events.length}개`, '덮어쓰기', () => applyBackup(data));
  } catch (err) {
    toast(err.message);
  }
}

  const t = state.settings.theme;

const VIEWS = { today:viewToday, memo:viewMemo, todo:viewTodo, calendar:viewCalendar, settings:viewSettings };

addEventListener('storage', e => { if (e.key === null || Object.values(KEYS).includes(e.key)) { load(); applyTheme(); render(); } });
// 자정이 지나면 오늘 표시 갱신
const refreshDay = () => { if (renderedDay !== today() && !document.querySelector('dialog') && !document.activeElement?.matches('input,textarea')) render(); };
setInterval(refreshDay, 60000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushSync(); else refreshDay(); });

load();
applyTheme();
render();
if (loadProblem) toast('일부 저장 데이터를 읽지 못했습니다. 원본은 별도 보관했으니 백업 파일이 있으면 불러와 주세요.');
</script>
