<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>memomate</title>
<link rel="icon" href="data:,">
<style>
/* Memomate 디자인 시스템: tokens.json(라이트·다크)과 components/bundle.css를 옮김 */
:root{
  --bg:#f3ede5; --card:#ffffff; --panel:#fdf6ee; --fill:#f5f3f6; --line:#e9e4ec; --nav:rgba(255,255,255,.84);
  --text:#2a0f3d; --sub:#675c72; --primary:#141828; --on-primary:#ffffff; --accent:#6f3379; --on-accent:#ffffff; --accent-text:#6f3379;
  --danger:#b51d2a; --on-danger:#ffffff; --ev:#dff1f2; --ev-text:#14565d;
  --tone-purple:#6f3379; --on-tone-purple:#ffffff; --tone-teal:#96d2d6; --on-tone-teal:#10282c; --tone-coral:#ff8557; --on-tone-coral:#2b0f05; --tone-blue:#2f62d6; --on-tone-blue:#ffffff;
  --sidebar:var(--card); --on-sidebar:var(--sub); --sidebar-active:var(--fill); --on-sidebar-active:var(--text);
  --chart-1:#6f3379; --chart-2:#d0521f; --chart-3:#278a92; --backdrop:rgba(30,14,40,.42);
  --memo-red:#ff453a; --memo-orange:#ff9f0a; --memo-yellow:#ffd60a; --memo-green:#30d158; --memo-blue:#0a84ff; --memo-purple:#bf5af2;
  --shadow-card:0 8px 24px rgba(60,30,70,.08); --shadow-seg:0 1px 4px rgba(60,30,70,.18); --shadow-dialog:0 20px 60px rgba(40,16,52,.28);
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-8:32px; --space-10:40px;
  --radius-xs:5px; --radius-sm:6px; --radius-md:8px; --radius-lg:12px; --radius-xl:18px; --radius-2xl:32px; --radius-pill:980px;
  --font-sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#14101c; --card:#1e1929; --panel:#251f30; --fill:#2b2438; --line:#3a3249; --nav:rgba(20,16,28,.84);
  --text:#f4eefa; --sub:#b9adc6; --primary:#f4eefa; --on-primary:#141828; --accent:#cf9bdb; --on-accent:#2a0f3d; --accent-text:#d8abe3;
  --danger:#ff8f8f; --on-danger:#2a0509; --ev:#17414a; --ev-text:#b5e6ea;
  --tone-purple:#7d3d88; --tone-teal:#8accd1; --tone-coral:#ff8f66; --tone-blue:#3566d4;
  --chart-1:#e3c2ea; --chart-2:#ff8f66; --chart-3:#4aa3ab; --backdrop:rgba(0,0,0,.6);
  --shadow-card:none; --shadow-seg:0 1px 4px rgba(0,0,0,.4); --shadow-dialog:0 20px 60px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{scroll-padding-top:64px}
body{background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:15px;line-height:1.5;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app:focus,#app:focus-visible{outline:none}
input[type=text],input[type=search],input[type=date],input[type=time],select,textarea{background:var(--fill);border:1px solid transparent;border-radius:var(--radius-md);padding:8px 12px;min-width:0;max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none;cursor:pointer}
.skip{position:absolute;left:-999px;top:8px;background:var(--card);padding:8px 12px;border-radius:var(--radius-md);z-index:60}
.skip:focus{left:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Navigation (상단 바) */
.bar{position:sticky;top:0;z-index:10;height:52px;padding:0 var(--space-5);display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);background:var(--nav);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.logo{font-weight:600;font-size:18px;text-decoration:none;white-space:nowrap;flex:none}
.nav{display:none;gap:var(--space-1)}
.nav a{color:var(--sub);text-decoration:none;font-size:14px;padding:6px 14px;border-radius:var(--radius-pill);white-space:nowrap}
.nav a:hover{color:var(--text)}
.nav a[aria-current]{background:var(--accent);color:var(--on-accent)}
.tools{display:flex;align-items:center;gap:var(--space-2)}
.quickbtn{display:flex;align-items:center;gap:var(--space-3);background:var(--fill);border-radius:var(--radius-md);padding:0 var(--space-3);height:40px;color:var(--sub);font-size:14px;min-width:180px;justify-content:space-between}
.quickbtn kbd{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:var(--radius-xs);padding:0 6px;background:var(--card)}
.iconbtn{position:relative;width:40px;height:40px;display:inline-grid;place-items:center;background:var(--fill);border-radius:var(--radius-md);flex:none;color:var(--text);text-decoration:none}
.iconbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:var(--radius-pill);background:var(--accent);color:var(--on-accent);font-size:11px;line-height:18px;text-align:center;font-weight:600}
.iconbtn[aria-current]{box-shadow:inset 0 0 0 2px var(--accent)}

/* DashboardLayout: 사이드바 | 본문 | 일정 패널 */
.shell{max-width:1320px;margin:0 auto;padding:var(--space-6) var(--space-5) 100px}
.dash{display:grid;grid-template-columns:168px minmax(0,1fr) 260px;background:var(--card);border-radius:var(--radius-2xl);overflow:hidden;box-shadow:var(--shadow-card);min-height:calc(100vh - 52px - 48px)}
.dash.norail{grid-template-columns:168px minmax(0,1fr)}
.sidebar{background:var(--sidebar);color:var(--on-sidebar);padding:var(--space-6) var(--space-3);display:flex;flex-direction:column;gap:var(--space-1);border-right:1px solid var(--line)}
.sidebar a,.sidebar button{color:var(--on-sidebar);text-decoration:none;font-size:14px;padding:8px 12px;border-radius:var(--radius-md);text-align:left;display:flex;justify-content:space-between;align-items:center;gap:var(--space-2)}
.sidebar a:hover,.sidebar button:hover{background:var(--fill)}
.sidebar a[aria-current]{background:var(--sidebar-active);color:var(--on-sidebar-active);font-weight:600}
.sidebar .sp{flex:1}
.sidebar .count{background:var(--accent);color:var(--on-accent);border-radius:var(--radius-pill);font-size:11px;padding:0 6px;font-weight:600}
.content{padding:var(--space-8) var(--space-6);display:flex;flex-direction:column;gap:var(--space-10);min-width:0}
.rail{padding:var(--space-6) var(--space-4);background:var(--panel);min-width:0}
.rail .timeline{background:none;padding:0;border-radius:0}
.timeline{background:var(--panel);border-radius:var(--radius-xl);padding:var(--space-5);display:flex;flex-direction:column;gap:var(--space-4)}
.timeline .date{font-size:13px;color:var(--sub)}
.timeline .allday{display:flex;flex-direction:column;gap:var(--space-1)}
.slot{display:grid;grid-template-columns:48px 4px minmax(0,1fr);gap:var(--space-3);align-items:stretch;text-align:left;width:100%;padding:2px 0}
.slot time{font-weight:700;font-size:15px}
.slot i{background:var(--tone);border-radius:var(--radius-pill)}
.slot small{display:block;font-size:13px;color:var(--sub)}
.slot:hover b{text-decoration:underline}
.tone-purple{--tone:var(--tone-purple);--on-tone:var(--on-tone-purple)}
.tone-teal{--tone:var(--tone-teal);--on-tone:var(--on-tone-teal)}
.tone-coral{--tone:var(--tone-coral);--on-tone:var(--on-tone-coral)}
.tone-blue{--tone:var(--tone-blue);--on-tone:var(--on-tone-blue)}

/* PageHeader, Card */
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--space-4);flex-wrap:wrap}
h1{font-size:40px;line-height:1.15;font-weight:700}
h2{font-size:19px;line-height:1.4;font-weight:600}
.lead{color:var(--sub);font-size:16px;margin-top:6px}
.card{background:var(--card);border-radius:var(--radius-xl);padding:var(--space-5);box-shadow:var(--shadow-card);min-width:0}
.dash .card{background:none;box-shadow:none;border:1px solid var(--line)}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:var(--space-2);margin-bottom:var(--space-2)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:var(--space-6);align-items:start}
.stack{display:flex;flex-direction:column;gap:var(--space-4);min-width:0}
.row{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--sub);font-size:13px}
.empty{color:var(--sub);padding:var(--space-5) 0;text-align:center;font-size:14px}
.late-text{color:var(--danger)}
.section{margin-top:14px}
.section h3{font-size:13px;color:var(--sub);display:flex;justify-content:space-between;align-items:center}

/* Button, Chip, SegmentedControl */
.btn{background:var(--primary);color:var(--on-primary);border-radius:var(--radius-md);padding:10px 22px;font-size:14px;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--fill);color:var(--text)}
.btn.danger{background:var(--danger);color:var(--on-danger)}
.btn.sm{padding:6px 14px}
.btn:disabled,.link:disabled{opacity:.45;cursor:default;filter:none}
.link{color:var(--accent-text);font-size:14px;padding:2px 6px;white-space:nowrap}
.link.danger{color:var(--danger)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--fill);border-radius:var(--radius-pill);padding:3px 12px;font-size:13px}
.chip[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.chip.kind{padding:0 10px;font-size:12px;background:var(--tone);color:var(--on-tone)}
.seg{display:inline-flex;align-self:flex-start;background:var(--fill);border-radius:var(--radius-md);padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{padding:5px 14px;border-radius:var(--radius-sm);font-size:14px;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--card);box-shadow:var(--shadow-seg);font-weight:600}

/* ListItem, TaskCard */
.item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item input[type=checkbox]{margin-top:1px}
.item.sub{padding-left:30px}
.item .main{flex:1;min-width:0;text-align:left;display:block;width:100%}
.item .ttl{display:block}
.item .meta{display:flex;gap:var(--space-2);flex-wrap:wrap;font-size:12px;color:var(--sub)}
.item.done .ttl{text-decoration:line-through;color:var(--sub)}
.item.late .ttl,.item.late .meta,.late-text{color:var(--danger)}
.item.dragover{box-shadow:0 2px 0 0 var(--accent)}
.item.dragging{opacity:.5}
.pri{font-weight:600}
.pri.high{font-weight:700;color:var(--accent-text)}
.pri.medium{color:var(--accent-text)}
.bell{font-size:12px}
.move{display:flex;gap:2px;flex:none}
.move button{padding:0 6px;font-size:13px;color:var(--accent-text);border-radius:var(--radius-xs)}
.move button:disabled{opacity:.35;cursor:default}
.handle{cursor:grab;color:var(--sub);padding:0 4px;user-select:none}
.tasks{display:flex;flex-direction:column;gap:var(--space-3)}
.task{display:flex;align-items:center;gap:var(--space-4);background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:var(--space-3) var(--space-5);border-left:6px solid var(--tone)}
.dash .task{box-shadow:none;border:1px solid var(--line);border-left:6px solid var(--tone)}
.task .main{flex:1;min-width:0;text-align:left}
.task strong{display:block;font-size:15px;font-weight:600}
.task small{display:flex;gap:var(--space-2);flex-wrap:wrap;font-size:13px;color:var(--sub)}
.task.done strong{text-decoration:line-through;color:var(--sub)}
.task.late small,.task.late strong{color:var(--danger)}
.task input[type=checkbox]{appearance:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--sub);display:grid;place-items:center}
.task input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
.task input[type=checkbox]:checked::after{content:"✓";color:var(--on-accent);font-size:12px;line-height:1}

/* MemoCard + 메모 화면 */
.memo-layout{display:grid;grid-template-columns:minmax(240px,320px) minmax(0,1fr);gap:var(--space-5);align-items:start}
.memo-list{display:flex;flex-direction:column;gap:var(--space-2);max-height:calc(100vh - 300px);overflow-y:auto;padding:2px}
.memo-card{display:block;width:100%;text-align:left;background:var(--card);border-radius:var(--radius-lg);padding:12px 14px;border:2px solid transparent;border-left:6px solid transparent;flex:none}
.dash .memo-card{background:var(--fill)}
.memo-card.on{border-top-color:var(--accent);border-right-color:var(--accent);border-bottom-color:var(--accent)}
.memo-card strong,.memo-card p{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.memo-card p{color:var(--sub);font-size:13px}
.c-red{border-left-color:var(--memo-red)!important}.c-orange{border-left-color:var(--memo-orange)!important}.c-yellow{border-left-color:var(--memo-yellow)!important}
.c-green{border-left-color:var(--memo-green)!important}.c-blue{border-left-color:var(--memo-blue)!important}.c-purple{border-left-color:var(--memo-purple)!important}
.swatch{width:24px;height:24px;border-radius:50%;border:2px solid var(--line)}
.swatch[aria-pressed=true]{outline:2px solid var(--text);outline-offset:2px}
.editor{display:flex;flex-direction:column;gap:var(--space-3);min-height:520px}
.editor .title{font-size:26px;font-weight:700;background:none;border:0;padding:0}
.editor textarea{min-height:320px;resize:vertical;background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:12px 0;line-height:1.7}
.editor textarea:focus{border-color:var(--accent)}
.back{display:none;align-self:flex-start}
.editor .row input[type=text]{flex:1 1 160px}

/* 위젯, 도넛, 표 */
.widgets{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:var(--space-6)}
.widget{background:var(--fill);border-radius:var(--radius-lg);padding:var(--space-5);min-height:116px;display:flex;flex-direction:column;justify-content:space-between;text-align:left}
.widget strong{font-size:22px;font-weight:700}
.widget span{font-size:13px;color:var(--sub)}
.widget .delta{font-size:12px}
.overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:var(--space-6);align-items:start}
.donut-wrap{display:flex;gap:var(--space-5);align-items:center;flex-wrap:wrap}
.donut{width:140px;height:140px;flex:none}
.donut circle{fill:none;stroke-width:5}
.donut .c1{stroke:var(--chart-1)}.donut .c2{stroke:var(--chart-2)}.donut .c3{stroke:var(--chart-3)}
.donut text{fill:var(--text);font-size:8px;font-weight:700;text-anchor:middle}
.legend{list-style:none;font-size:13px;display:flex;flex-direction:column;gap:var(--space-1)}
.legend li{display:flex;gap:var(--space-2);align-items:center}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--chart-1);flex:none}
.legend i.k2{background:var(--chart-2)}.legend i.k3{background:var(--chart-3)}
.table-scroll{overflow-x:auto}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th{text-align:left;font-size:12px;font-weight:600;color:var(--sub);padding:var(--space-2);border-bottom:1px solid var(--line)}
.table td{padding:10px var(--space-2);border-bottom:1px solid var(--line)}
.table td+td{white-space:nowrap}
.table td button{text-align:left}
.table tr:last-child td{border-bottom:0}
.status{background:var(--ev);color:var(--ev-text);border-radius:var(--radius-pill);padding:2px 10px;font-size:12px;white-space:nowrap}
.status.late{background:var(--danger);color:var(--on-danger)}
.status.done{background:var(--fill);color:var(--sub)}
.chart{width:100%;max-width:420px;height:auto;display:block}
.chart .bar1{fill:var(--chart-1)}.chart .bar2{fill:var(--chart-2)}.chart .bar3{fill:var(--chart-3)}
.chart text{fill:var(--text);font-size:11px;text-anchor:middle}
.chart text.sub{fill:var(--sub);font-size:10px}
.chart line{stroke:var(--line);stroke-width:1}
.tagbars{list-style:none;display:flex;flex-direction:column;gap:var(--space-2);font-size:14px}
.tagbars li{display:grid;grid-template-columns:minmax(60px,110px) 1fr 28px;gap:var(--space-2);align-items:center}
.tagbars i{display:block;height:8px;border-radius:var(--radius-pill);background:var(--chart-3)}
.cmp{display:flex;flex-direction:column;gap:var(--space-2);font-size:13px}
.cmp div{display:grid;grid-template-columns:44px 1fr 28px;gap:var(--space-2);align-items:center}
.cmp i{display:block;height:10px;border-radius:var(--radius-pill)}

/* 캘린더 */
.cal-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:var(--space-5);align-items:start}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow{text-align:center;font-size:12px;color:var(--sub);padding:6px 0}
.day{border-top:1px solid var(--line);min-height:104px;padding:4px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;overflow:hidden}
.day:hover{background:var(--fill)}
.day.other{background:var(--fill)}
.day.other .num{color:var(--sub)}
.day.sel{background:var(--fill);box-shadow:inset 0 0 0 2px var(--accent)}
.day.drop,.wk-col.drop,.wk-head.drop{background:var(--ev);box-shadow:inset 0 0 0 2px var(--accent)}
.num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;flex:none}
.sun,.hol{color:var(--danger)}
.sat{color:var(--accent-text)}
.today .num{background:var(--accent);color:var(--on-accent);font-weight:700}
.hname{font-size:11px;color:var(--danger);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:block;font-size:11px;line-height:1.6;border-radius:var(--radius-xs);padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--ev);color:var(--ev-text)}
.tag.todo{background:var(--fill);color:var(--text)}
.tag.todo.late{color:var(--danger)}
.tag.todo.done{text-decoration:line-through;color:var(--sub)}
.tag.memo{background:none;color:var(--sub)}
[data-drag]{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.drag-ghost{position:fixed;z-index:70;pointer-events:none;opacity:.9;box-shadow:var(--shadow-card);max-width:220px;background:var(--ev);color:var(--ev-text);border-radius:var(--radius-xs);padding:2px 8px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drag-ghost.todo{background:var(--fill);color:var(--text)}
.wk{border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}
.wk-scroll{overflow:auto;max-height:560px}
.wk-grid{display:grid;grid-template-columns:44px repeat(7,minmax(88px,1fr));min-width:700px}
.wk-headrow{display:contents}
.wk-corner,.wk-head{position:sticky;top:0;z-index:3;background:var(--card);border-bottom:1px solid var(--line)}
.wk-head{padding:4px;display:flex;flex-direction:column;gap:2px;min-width:0;border-left:1px solid var(--line);text-align:left}
.wk-head:hover{background:var(--fill)}
.wk-head.sel{box-shadow:inset 0 -3px 0 var(--accent)}
.wk-head .hd{display:flex;gap:6px;align-items:center;font-size:12px}
.wk-body{position:relative;grid-column:1 / -1;display:grid;grid-template-columns:44px repeat(7,minmax(88px,1fr));height:1152px}
.wk-hours{position:relative}
.wk-hours span{position:absolute;right:6px;font-size:11px;color:var(--sub);transform:translateY(-50%)}
.wk-lines{position:absolute;inset:0;pointer-events:none}
.wk-lines i{position:absolute;left:44px;right:0;border-top:1px solid var(--line)}
.wk-col{position:relative;border-left:1px solid var(--line);min-width:0}
.wk-col.sel{background:var(--fill)}
.wk-ev{position:absolute;left:2px;right:2px;border-radius:var(--radius-xs);padding:1px 5px;font-size:12px;line-height:1.35;overflow:hidden;background:var(--ev);color:var(--ev-text);border-left:4px solid var(--tone-teal);text-align:left;z-index:2;cursor:grab;touch-action:manipulation}
.wk-ev.todo{background:var(--fill);color:var(--text);border-left-color:var(--tone-purple)}
.wk-ev.late{color:var(--danger)}
.wk-ev.dragging{z-index:5;box-shadow:var(--shadow-card);opacity:.9;pointer-events:none}
.wk-ev b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-now{position:absolute;left:0;right:0;border-top:2px solid var(--accent);z-index:1;pointer-events:none}
.timelabel{position:fixed;z-index:70;pointer-events:none;background:var(--text);color:var(--bg);border-radius:var(--radius-pill);padding:2px 10px;font-size:12px}

/* Dialog */
dialog{border:0;border-radius:var(--radius-xl);padding:22px;width:min(480px,calc(100vw - 28px));max-height:88vh;overflow:auto;background:var(--card);color:var(--text);margin:auto;box-shadow:var(--shadow-dialog)}
dialog::backdrop{background:var(--backdrop)}
dialog form,dialog .dlgbody{display:flex;flex-direction:column;gap:var(--space-3)}
dialog label{display:flex;flex-direction:column;gap:var(--space-1);font-size:13px;color:var(--sub)}
dialog label input,dialog label select,dialog label textarea{color:var(--text);font-size:15px;width:100%}
dialog label.inline{flex-direction:row;align-items:center;gap:var(--space-2)}
dialog label.inline input{width:20px}
dialog .actions,.actions{display:flex;justify-content:flex-end;gap:var(--space-2);margin-top:6px;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-2)}
.rem-rows{display:flex;flex-direction:column;gap:var(--space-2)}
.rem-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-2);align-items:center}
.rem-row .custom{grid-column:1 / -1;display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2)}
.fieldset{display:flex;flex-direction:column;gap:var(--space-2)}
.fieldset>.lbl{font-size:13px;color:var(--sub)}
.lf{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--sub);flex:1 1 160px;min-width:0}
.lf input{color:var(--text);font-size:15px}
.chk{display:flex;flex:none}
.task .chk{align-items:center}
.kbd-table{width:100%;border-collapse:collapse;font-size:14px}
.kbd-table td{padding:6px 0;border-bottom:1px solid var(--line)}
.kbd-table td:first-child{white-space:nowrap;padding-right:var(--space-4)}
kbd{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:var(--radius-xs);padding:0 6px;background:var(--fill)}
.brief h3{font-size:13px;color:var(--sub);margin-top:var(--space-2)}
.brief ul{list-style:none;display:flex;flex-direction:column;gap:2px;font-size:14px}

/* Toast (동작 버튼 없음. 단, 드래그 이동의 '실행 취소' 링크 하나만 예외) */
.toasts{position:fixed;left:0;right:0;bottom:86px;display:flex;justify-content:center;z-index:50;pointer-events:none;padding:0 var(--space-4)}
.toast{display:flex;gap:var(--space-3);align-items:center;width:max-content;max-width:90vw;background:var(--text);color:var(--bg);padding:10px 18px;border-radius:var(--radius-pill);font-size:14px}
.toast-undo{color:inherit;text-decoration:underline;font-size:14px;pointer-events:auto;padding:0 2px}
.toast-undo:focus-visible{outline-color:var(--bg)}

/* 알림 카드 (Toast와 별개: 동작 버튼이 있어 Card 형태로 만듦) */
.alerts{position:fixed;top:60px;right:var(--space-4);width:min(380px,calc(100vw - 32px));display:flex;flex-direction:column;gap:var(--space-3);z-index:40;max-height:calc(100vh - 80px);overflow-y:auto;padding:4px}
.alerts:empty{display:none}
.alert{border-left:6px solid var(--tone);box-shadow:var(--shadow-dialog);display:flex;flex-direction:column;gap:var(--space-2);background:var(--card)}
.dash .alert{background:var(--card)}
.alert-head{display:flex;gap:var(--space-2);align-items:center;min-width:0}
.alert-head strong{min-width:0;flex:1}
.alertbar{display:flex;justify-content:flex-end}

/* 빠른 입력 */
.quick{position:fixed;top:60px;left:0;right:0;margin:0 auto;width:min(620px,calc(100vw - 24px));z-index:45}
.quick .qfoot{display:none}
.quick .card{box-shadow:var(--shadow-dialog);display:flex;flex-direction:column;gap:var(--space-3)}
.quick input[type=text]{font-size:16px;padding:12px 14px;width:100%}
.quick .preview{font-size:14px;min-height:22px}
.quick .preview b{font-weight:600}
.quick ul{list-style:none;font-size:13px;color:var(--sub)}
.quick .hint{font-size:12px;color:var(--sub)}

/* 모양 보조 */
.pager{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap}
.notice{background:var(--fill);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4);display:flex;gap:var(--space-3);align-items:center;justify-content:space-between;flex-wrap:wrap}
.rlist .item .main{width:auto}
.row-actions{display:flex;gap:2px;flex-wrap:wrap;margin-top:2px}
.unread-dot{font-size:11px;background:var(--accent);color:var(--on-accent);border-radius:var(--radius-pill);padding:0 8px}

  .memo-layout .editor{display:none}

  .editor .row input[type=text]{flex:1 1 100%}
  form.card .grow{flex-basis:100%}
  .cal-card{padding:10px 6px}
  .month .day{min-height:62px;padding:2px;align-items:center}
  .month .hname{font-size:9px;max-width:100%}
  .month .tags{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
  .month .tag{width:8px;height:8px;border-radius:50%;padding:0;font-size:0;background:var(--accent)}

  .alerts{top:56px;right:8px;left:8px;width:auto;max-height:60vh;background:none}
  .nav a{min-height:44px;display:flex;align-items:center;justify-content:center}
  .link{min-height:40px;display:inline-flex;align-items:center;padding:0 10px}
  .btn.sm{min-height:40px}

  .table td button{min-height:40px}

  .seg button,button.chip{min-height:40px}
  button.chip{padding:8px 14px}
  .seg.wrap{flex-wrap:wrap;overflow:visible}
  .swatch{width:32px;height:32px}

  .chk input[type=checkbox]{width:24px;height:24px}
  .quick::before{content:"";position:fixed;inset:0;background:var(--backdrop);z-index:-1}
  .quick .hint{display:none}
  .quick .qfoot{display:flex;gap:var(--space-2);justify-content:flex-end}
  .rem-row .custom{grid-template-columns:1fr}
  input[type=text],input[type=search],input[type=date],input[type=time],select,textarea,dialog label input,dialog label select,dialog label textarea{font-size:16px}
}

<body>
<a class="skip" href="#app">본문으로 건너뛰기</a>
<header class="bar">
  <a class="logo" href="#today">memomate</a>
  <nav class="nav" aria-label="주 메뉴">
    <a href="#today">오늘</a><a href="#memo">메모</a><a href="#todo">할 일</a><a href="#calendar">캘린더</a><a href="#review">회고</a><a href="#settings">설정</a>
  </nav>
  <div class="tools">
    <button class="quickbtn" id="quickBtn" type="button" aria-label="빠른 입력 열기 (Ctrl+K 또는 /)"><span class="qt">빠른 입력</span><kbd>Ctrl K</kbd></button>
    <button class="iconbtn searchBtn" type="button" aria-label="통합 검색 (Ctrl+F)"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    <a class="iconbtn js-bell" id="bellBtn" href="#inbox" aria-label="알림함, 읽지 않은 알림 없음"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span class="badge js-unread" hidden></span></a>
  </div>
</header>
<div class="shell">
  <div class="dash" id="dash">
    <nav class="sidebar" aria-label="화면 이동">
      <a href="#today">오늘</a><a href="#memo">메모</a><a href="#todo">할 일</a><a href="#calendar">캘린더</a><a href="#review">회고</a><a href="#inbox">알림함 <span class="count js-unread" hidden></span></a><a href="#settings">설정</a>
      <span class="sp"></span>
      <button type="button" id="helpBtn">단축키 ?</button>
    </nav>

</div>

    <input type="text" id="quickInput" autocomplete="off" aria-label="빠른 입력" aria-describedby="quickPreview" placeholder="내일 오후 3시 팀 회의 30분 전 알림 #업무">
    <div class="row" id="quickType" role="group" aria-label="종류"></div>
    <div id="quickPreview" class="preview" aria-live="polite"></div>
    <div class="hint">Enter 저장 · Tab 종류 바꾸기 · Esc 닫기</div>
    <div class="qfoot"><button class="btn sec" id="quickClose" type="button">닫기</button><button class="btn" id="quickSave" type="button">저장</button></div>
  </div>
</div>
<div id="alerts" class="alerts" aria-live="assertive" aria-relevant="additions text" aria-label="알림"></div>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>

<script>
'use strict';

/* ───────── 저장 계층 ───────── */
const KEYS = { memos:'memomate.memos', todos:'memomate.todos', events:'memomate.events', settings:'memomate.settings', reminders:'memomate.reminders' };
const LOCK_KEY = 'memomate.lock'; // 알림 발송 잠금(단일 탭 발송). KEYS에 넣지 않아 storage 이벤트로 화면이 다시 그려지지 않음
const VERSION = 2; // 2: reminders·알림 설정 포함 (1단계 백업도 그대로 복원 가능)
const COLORS = ['', 'red', 'orange', 'yellow', 'green', 'blue', 'purple'];
const COLOR_NAMES = { '':'색 없음', red:'빨강', orange:'주황', yellow:'노랑', green:'초록', blue:'파랑', purple:'보라' };
const PRI = { high:'상', medium:'중', low:'하' };
const REPEAT = { daily:'매일', weekly:'매주', monthly:'매월' };

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const nowIso = () => new Date().toISOString(); // 타임스탬프 전용. 날짜 계산에는 ymd() 사용

/* ───────── 날짜 유틸 (모두 로컬 시간) ───────── */
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const daysInMonth = (y, m) => new Date(y, m + 1, 0).getDate();
const WD = ['일', '월', '화', '수', '목', '금', '토'];
const fmtDate = s => { const d = parseYmd(s); const y = d.getFullYear() !== new Date().getFullYear() ? `${d.getFullYear()}년 ` : ''; return `${y}${d.getMonth() + 1}월 ${d.getDate()}일 (${WD[d.getDay()]})`; };
const fmtStamp = iso => { const d = new Date(iso); return isNaN(d) ? '' : `${fmtDate(ymd(d))} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const isDate = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && ymd(parseYmd(s)) === s;
const isDateTime = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}T([01]\d|2[0-3]):[0-5]\d$/.test(s) && isDate(s.slice(0, 10));
const isTime = s => typeof s === 'string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(s);

/* ───────── 한국 공휴일 (2025~2027) ─────────
   관공서 공휴일·대체공휴일·임시공휴일·선거일을 직접 입력한 정적 데이터.
   웹 검색 자료 기준이며 법령 원문과 대조하지 않았음. 2028년 이후는 포함되지 않음. */
const HOLIDAYS = {
  2025: { '01-01':'신정', '01-27':'임시공휴일', '01-28':'설날 연휴', '01-29':'설날', '01-30':'설날 연휴', '03-01':'삼일절', '03-03':'대체공휴일', '05-05':'어린이날·부처님오신날', '05-06':'대체공휴일', '06-03':'대통령 선거일', '06-06':'현충일', '08-15':'광복절', '10-03':'개천절', '10-05':'추석 연휴', '10-06':'추석', '10-07':'추석 연휴', '10-08':'대체공휴일', '10-09':'한글날', '12-25':'성탄절' },
  2026: { '01-01':'신정', '02-16':'설날 연휴', '02-17':'설날', '02-18':'설날 연휴', '03-01':'삼일절', '03-02':'대체공휴일', '05-01':'노동절', '05-05':'어린이날', '05-24':'부처님오신날', '05-25':'대체공휴일', '06-03':'지방선거일', '06-06':'현충일', '07-17':'제헌절', '08-15':'광복절', '08-17':'대체공휴일', '09-24':'추석 연휴', '09-25':'추석', '09-26':'추석 연휴', '10-03':'개천절', '10-05':'대체공휴일', '10-09':'한글날', '12-25':'성탄절' },
  2027: { '01-01':'신정', '02-06':'설날 연휴', '02-07':'설날', '02-08':'설날 연휴', '02-09':'대체공휴일', '03-01':'삼일절', '05-01':'노동절', '05-03':'대체공휴일', '05-05':'어린이날', '05-13':'부처님오신날', '06-06':'현충일', '07-17':'제헌절', '07-19':'대체공휴일', '08-15':'광복절', '08-16':'대체공휴일', '09-14':'추석 연휴', '09-15':'추석', '09-16':'추석 연휴', '10-03':'개천절', '10-04':'대체공휴일', '10-09':'한글날', '10-11':'대체공휴일', '12-25':'성탄절', '12-27':'대체공휴일' }
};
const holiday = s => HOLIDAYS[s.slice(0, 4)]?.[s.slice(5)] || '';

/* ───────── 데이터 정규화 (저장소·가져오기 공용) ───────── */
const str = v => typeof v === 'string' ? v : '';
const opt = v => typeof v === 'string' && v ? v : null;
const stamp = v => typeof v === 'string' && !isNaN(Date.parse(v)) ? v : nowIso();
const isoOrNull = v => typeof v === 'string' && !isNaN(Date.parse(v)) ? v : null;
const cleanTags = v => Array.isArray(v) ? [...new Set(v.filter(t => typeof t === 'string' && t.trim()).map(t => t.trim().replace(/^#/, '')))] : [];
const REMINDER_STATUS = ['pending', 'fired', 'snoozed', 'done', 'dismissed', 'missed'];
const REMINDER_TARGETS = ['todo', 'event', 'memo'];
const normalize = {
  memos: m => ({ id:str(m.id) || uid(), title:str(m.title), body:str(m.body), tags:Array.isArray(m.tags) ? m.tags.filter(t => typeof t === 'string' && t) : [], folder:str(m.folder), pinned:!!m.pinned, color:COLORS.includes(m.color) ? m.color : '', date:isDate(m.date) ? m.date : null, aiExcluded:!!m.aiExcluded, createdAt:stamp(m.createdAt), updatedAt:stamp(m.updatedAt), deletedAt:opt(m.deletedAt) }),
  todos: t => {
    const due = isDate(t.due) ? t.due : null, done = !!t.done;
    return { id:str(t.id) || uid(), title:str(t.title), done, due, dueTime:due && isTime(t.dueTime) ? t.dueTime : null, priority:Object.hasOwn(PRI, t.priority) ? t.priority : 'medium', parentId:opt(t.parentId), repeat:Object.hasOwn(REPEAT, t.repeat) ? t.repeat : null, repeatDay:Number.isInteger(t.repeatDay) ? t.repeatDay : null, spawned:!!t.spawned, memoId:opt(t.memoId), memoOrder:Number.isInteger(t.memoOrder) ? t.memoOrder : null,
      postponeCount:Number.isInteger(t.postponeCount) && t.postponeCount > 0 ? t.postponeCount : 0, order:Number.isFinite(t.order) ? t.order : null, tags:cleanTags(t.tags), completedAt:done ? isoOrNull(t.completedAt) : null, createdAt:stamp(t.createdAt), updatedAt:stamp(t.updatedAt) };
  },
  events: e => {
    const allDay = !!e.allDay, ok = allDay ? isDate : isDateTime;
    if (!ok(e.start)) return null;
    return { id:str(e.id) || uid(), title:str(e.title), start:e.start, end:ok(e.end) && e.end >= e.start ? e.end : null, allDay, note:str(e.note), tags:cleanTags(e.tags), createdAt:stamp(e.createdAt), updatedAt:stamp(e.updatedAt) };
  },
  // 알림. 모양은 PRD §3.4 + 내부용 필드(silent·missed·suppressed·snoozeCount·title·baseKey)
  reminders: r => {
    if (!REMINDER_TARGETS.includes(r.targetType) || !str(r.targetId)) return null;
    const fire = typeof r.fireAt === 'string' ? Date.parse(r.fireAt) : NaN;
    if (isNaN(fire)) return null;

//  overdue: 마감일이 이 주에 있었는데 아직 못 끝낸 할 일(오늘 이전 마감) · overdueNow: 지금 기한이 지난 할 일 전체
//  topTags: 이 주에 만들거나 완료한 할 일·시작한 일정·만든 메모의 태그 상위 5개
function weeklyStats(offset = 0, now = new Date()) {
  const todayStr = ymd(now);
  const calc = off => {
    const start = addDays(mondayOf(todayStr), off * 7), end = addDays(start, 6);
    const inWeek = iso => { if (!iso) return false; const d = new Date(iso); if (isNaN(d)) return false; const s = ymd(d); return s >= start && s <= end; };
    const doneAt = t => t.completedAt || t.updatedAt;
    const done = state.todos.filter(t => t.done && inWeek(doneAt(t)));
    const created = state.todos.filter(t => inWeek(t.createdAt));
    const days = WD_MON.map((label, i) => { const date = addDays(start, i); return { date, label, completed:done.filter(t => ymd(new Date(doneAt(t))) === date).length, isToday:date === todayStr }; });
    const tags = new Map();
    const bump = list => list.forEach(x => (x.tags || []).forEach(g => tags.set(g, (tags.get(g) || 0) + 1)));
    bump([...new Set([...done, ...created])]);
    bump(state.events.filter(e => { const s = e.start.slice(0, 10); return s >= start && s <= end; }));
    bump(state.memos.filter(m => !m.deletedAt && inWeek(m.createdAt)));
    return { offset:off, start, end, days, completed:done.length, created:created.length,
      overdue:state.todos.filter(t => !t.done && t.due && t.due >= start && t.due <= end && t.due < todayStr).length,
      topTags:[...tags].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, 5).map(([tag, count]) => ({ tag, count })) };
  };
  const cur = calc(offset), prev = calc(offset - 1);
  const diff = k => cur[k] - prev[k];
  return { ...cur, overdueNow:state.todos.filter(t => !t.done && t.due && t.due < todayStr).length,
    prev:{ start:prev.start, end:prev.end, completed:prev.completed, created:prev.created, overdue:prev.overdue },
    delta:{ completed:diff('completed'), created:diff('created'), overdue:diff('overdue') } }; // 양수=증가(▲), 음수=감소(▼)
}

// 미룬 일: 마감일을 2번 이상 미뤘거나(postponeCount>=2) 기한이 3일 이상 지난 미완료 할 일. [{ todo, postponeCount, overdueDays, reasons:['postponed'|'overdue'] }]
function postponedTodos(now = new Date()) {
  const td = ymd(now);
  return state.todos.filter(t => !t.done).map(t => {
    const overdueDays = t.due ? Math.max(0, daysBetween(t.due, td)) : 0, reasons = [];
    if ((t.postponeCount || 0) >= 2) reasons.push('postponed');
    if (overdueDays >= 3) reasons.push('overdue');
    return reasons.length ? { todo:t, postponeCount:t.postponeCount || 0, overdueDays, reasons } : null;
  }).filter(Boolean).sort((a, b) => b.overdueDays - a.overdueDays || b.postponeCount - a.postponeCount);
}
// 일괄 처리. op: 'today' | 'nextWeek'(다음 주 월요일) | 'clearDue' | 'delete'. 처리한 일은 postponeCount를 0으로 되돌려 목록에서 빠진다. 반환: 처리한 개수
function bulkTodos(ids, op, now = new Date()) {
  const set = new Set(ids), td = ymd(now);
  const list = state.todos.filter(t => set.has(t.id));
  if (!list.length) return 0;
  if (op === 'delete') removeTodos(list.map(t => t.id));
  else for (const t of list) {
    if (op === 'today') t.due = td;
    else if (op === 'nextWeek') t.due = addDays(mondayOf(td), 7);
    else if (op === 'clearDue') { t.due = null; t.dueTime = null; t.repeatDay = null; }
    else continue;
    if (t.due) { if (t.repeat) t.repeatDay = parseYmd(t.due).getDate(); } else if (t.repeat) { t.repeat = null; }
    t.postponeCount = 0; t.spawned = false; t.updatedAt = nowIso();
  }
  save('todos'); // 연결된 상대 알림은 reconcile이 새 마감에 맞춤
  return list.length;
}

// 직접 정렬(settings.todoSort === 'manual')
const todoComparator = () => state.settings.todoSort === 'manual'
  ? (a, b) => (a.done - b.done) || ((a.order ?? Infinity) - (b.order ?? Infinity) || 0) || byTodo(a, b) : byTodo;
function setTodoSort(mode) { state.settings.todoSort = mode === 'manual' ? 'manual' : 'auto'; save('settings'); }
// id 항목을 targetId 항목 앞(after=false)/뒤(after=true)로 옮기고 전체 order를 0..N-1로 다시 매긴다
function moveTodoOrder(id, targetId, after = false) {
  const list = [...state.todos].sort((a, b) => ((a.order ?? Infinity) - (b.order ?? Infinity) || 0) || a.createdAt.localeCompare(b.createdAt));
  const from = list.findIndex(t => t.id === id);
  if (from < 0 || id === targetId) return false;
  const [item] = list.splice(from, 1);
  const to = list.findIndex(t => t.id === targetId);
  if (to < 0) return false;
  list.splice(after ? to + 1 : to, 0, item);
  list.forEach((t, i) => { t.order = i; });
  save('todos');
  return true;
}

// 캘린더 드래그 이동(§4.3.3). 반환하는 undo()를 '실행 취소' 토스트에 연결. 연결된 상대 알림은 save() 시 자동 재계산
function moveTodoToDate(id, due, dueTime) {
  const t = state.todos.find(x => x.id === id);
  if (!t) return null;
  const prev = { due:t.due, dueTime:t.dueTime, postponeCount:t.postponeCount, repeatDay:t.repeatDay, spawned:t.spawned };
  updateTodo(id, dueTime === undefined ? { due } : { due, dueTime });
  return () => { const x = state.todos.find(y => y.id === id); if (x) { Object.assign(x, prev, { updatedAt:nowIso() }); save('todos'); } };
}
// newStart: 종일 'YYYY-MM-DD' / 시간 지정 'YYYY-MM-DDTHH:MM'. 종료 시각은 같은 간격으로 이동
function moveEvent(id, newStart) {
  const e = state.events.find(x => x.id === id);
  if (!e || !(e.allDay ? isDate(newStart) : isDateTime(newStart))) return null;
  const prev = { start:e.start, end:e.end };
  if (e.allDay) {
    const dd = daysBetween(e.start, newStart);
    e.start = newStart; if (e.end) e.end = addDays(e.end, dd);
  } else {
    const shift = (v, ms) => localDT(new Date(v).getTime() + ms);
    const ms = new Date(newStart).getTime() - new Date(e.start).getTime();
    e.start = newStart; if (e.end) e.end = shift(prev.end, ms);
  }
  e.updatedAt = nowIso();
  save('events');
  return () => { const x = state.events.find(y => y.id === id); if (x) { Object.assign(x, prev, { updatedAt:nowIso() }); save('events'); } };
}

/* ───────── 열린 다이얼로그 안으로 알림·토스트를 옮김 (모달이 열려 있으면 바깥 요소는 눌리지 않으므로) ───────── */
function remountOverlays(except) {
  const open = [...document.querySelectorAll('dialog[open]')].filter(d => d !== except);
  const host = open.length ? open[open.length - 1] : document.body;
  for (const el of [alertsEl, toastsEl]) if (el && el.parentNode !== host) host.append(el);
}
function modal(build) {
  const dlg = h('dialog');
  let closed = false;
  const close = () => { if (closed) return; closed = true; remountOverlays(dlg); try { dlg.close(); } catch {} dlg.remove(); };
  dlg.append(...[build(close)].flat());
  dlg.addEventListener('cancel', e => { e.preventDefault(); close(); });
  dlg.addEventListener('close', () => { remountOverlays(dlg); dlg.remove(); });
  document.body.append(dlg);
  dlg.showModal();
  const hd = dlg.querySelector('h2');
  if (hd) { hd.id = 'dlg-' + uid(); dlg.setAttribute('aria-labelledby', hd.id); }
  remountOverlays();
  return { dlg, close };
}

const alertNodes = new Map(); // key → { node, rid }

function restoreFocus(f) {
  if (f && f.isConnected) { f.focus(); return; }
  const a = f?.getAttribute?.('aria-label');
  const again = a && !a.includes('"') ? document.querySelector(`[aria-label="${a}"]`) : null;
  (again || $app).focus?.({ preventScroll:true });
}

function refreshAlertBar() {
  alertsEl.querySelector('.alertbar')?.remove();
  const nodes = [...alertNodes.values()].map(x => x.node), n = nodes.length;
  if (n < 2) alertsOpen = false;
  const collapse = n >= 2 && !alertsOpen && matchMedia('(max-width:760px)').matches;
  nodes.forEach((node, i) => { node.hidden = collapse && i < n - 1; });

    for (const [key, { rid }] of [...alertNodes]) { if (rid) reminderAction(rid, 'dismiss'); removeAlert(key); }
  }), 'btn sec sm')));

function reminderEditor(initial = [], { allDay = false, label = '알림', single = false } = {}) {

  try { data = JSON.parse(text); } catch { throw new Error('JSON 형식이 아닙니다.'); }
  if (!data || data.app !== 'memomate' || !Number.isInteger(data.version)) throw new Error('memomate 백업 파일이 아닙니다.');
  if (data.version > VERSION) throw new Error('더 새로운 버전의 백업 파일이라 불러올 수 없습니다.');
  const out = {};
  for (const kind of ['memos', 'todos', 'events']) {
    if (!Array.isArray(data[kind])) throw new Error('백업 파일의 구조가 올바르지 않습니다.');
    out[kind] = cleanList(kind, data[kind]);
    if (out[kind].length !== data[kind].length) throw new Error('백업 파일에 손상된 항목이 있어 불러오지 않았습니다.');
  }
  // 1단계 백업에는 reminders·settings가 없다 → 알림 없음 / 현재 설정 유지
  if (data.reminders === undefined) out.reminders = [];
  else {
    if (!Array.isArray(data.reminders)) throw new Error('백업 파일의 구조가 올바르지 않습니다.');
    out.reminders = cleanList('reminders', data.reminders);
    if (out.reminders.length !== data.reminders.length) throw new Error('백업 파일에 손상된 알림이 있어 불러오지 않았습니다.');
  }
  if (data.settings && typeof data.settings === 'object') {
    const n = normalizeSettings({ notify:data.settings.notify, todoSort:data.settings.todoSort });
    out.settings = { notify:n.notify, todoSort:n.todoSort };
  }
  return out;
}
function applyBackup(data) {
  flushSync();
  const before = { memos:state.memos, todos:state.todos, events:state.events, reminders:state.reminders, settings:state.settings };
  const { settings, ...lists } = data;
  Object.assign(state, lists);
  if (settings) state.settings = { ...state.settings, ...settings };
  if (!save('memos', 'todos', 'events', 'reminders', 'settings')) { Object.assign(state, before); save('memos', 'todos', 'events', 'reminders', 'settings'); return; }
  memoUI.selected = null; memoUI.filter = null;
  render();
  toast('백업을 불러왔습니다.');
}
async function importFile(file) {
  try {
    const data = parseBackup(await file.text());
    ask([`현재 데이터를 모두 덮어씁니다. 되돌릴 수 없습니다.`, `파일 내용: 메모 ${data.memos.length}개, 할 일 ${data.todos.length}개, 일정 ${data.events.length}개, 알림 ${data.reminders.length}개`], '덮어쓰기', () => applyBackup(data));
  } catch (err) {
    toast(err.message);
  }
}
function applyTheme() {
  const t = state.settings.theme;
  const dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
}

function notifyCard() {
  const n = state.settings.notify, perm = notifyPermission();
  const permText = { granted:'브라우저 알림이 켜져 있습니다.', denied:'브라우저 알림이 꺼져 있습니다. 앱 안 알림 카드와 소리만 사용합니다. 주소창의 사이트 설정에서 다시 켤 수 있습니다.',
    default:'브라우저 알림 권한을 아직 요청하지 않았습니다. 처음 알림을 설정할 때 묻습니다.', unsupported:'이 브라우저는 알림을 지원하지 않습니다. 앱 안 알림 카드와 소리만 사용합니다.' }[perm];
  const check = (label, val, onch) => h('label', { class:'row' }, h('input', { type:'checkbox', checked:val, 'aria-label':label, onchange:e => onch(e.target.checked) }), label);
  const time = (label, val, onch) => h('label', { class:'row' }, h('span', { class:'muted' }, label), h('input', { type:'time', value:val, onchange:e => { if (isTime(e.target.value)) onch(e.target.value); } }));
  const dayBtns = WD.map((w, i) => btn(w, e => {
    const set = new Set(state.settings.notify.dnd.days);
    set.has(i) ? set.delete(i) : set.add(i);
    updateNotifySettings({ dnd:{ days:[...set] } });
    e.currentTarget.setAttribute('aria-pressed', String(set.has(i)));
  }, 'chip', { 'aria-pressed':String(n.dnd.days.includes(i)), 'aria-label':`${w}요일 방해 금지` }));
  return card('알림', null, h('div', { class:'stack' },
    h('p', { role:'status' }, permText),
    h('div', { class:'row' },
      perm === 'default' && btn('권한 요청', async () => { await requestNotifyPermission(); render(); }, 'btn sec'),
      btn('테스트 알림', () => { const shown = testNotification(); toast(shown ? '테스트 알림을 보냈습니다.' : '소리만 재생했습니다. 브라우저 알림은 꺼져 있습니다.'); }, 'btn sec')),
    check('알림음', n.sound, v => updateNotifySettings({ sound:v })),
    time('기본 알림 시각 (시각이 없는 일의 기준)', n.defaultTime, v => { updateNotifySettings({ defaultTime:v }); toast('저장했습니다.'); }),
    check('아침 브리핑', n.briefing, v => updateNotifySettings({ briefing:v })),
    time('브리핑 시각', n.briefingTime, v => { updateNotifySettings({ briefingTime:v }); toast('저장했습니다.'); }),
    h('div', { class:'fieldset', role:'group', 'aria-label':'방해 금지' },
      check('방해 금지 (알림음과 알림 카드 없이 알림함에만 쌓기)', n.dnd.enabled, v => updateNotifySettings({ dnd:{ enabled:v } })),
      h('div', { class:'row' }, time('시작', n.dnd.start, v => updateNotifySettings({ dnd:{ start:v } })), time('끝', n.dnd.end, v => updateNotifySettings({ dnd:{ end:v } }))),
      h('div', { class:'chips', role:'group', 'aria-label':'방해 금지 요일' }, dayBtns),
      h('p', { class:'muted' }, '요일은 시간대가 시작하는 날을 기준으로 합니다.'))));
}
function viewSettings() {
  const file = h('input', { type:'file', accept:'.json,application/json', hidden:true, onchange:e => { const f = e.target.files[0]; e.target.value = ''; if (f) importFile(f); } });
  return [
    pagehead('설정'),
    h('div', { class:'grid' },
      notifyCard(),
      h('div', { class:'stack' },
        card('백업', null, h('div', { class:'stack' },
          h('p', null, '데이터는 이 브라우저에만 저장됩니다. 브라우저 데이터를 지우면 사라지니 정기적으로 내보내 주세요.'),
          h('p', { class:'muted' }, `메모 ${activeMemos().length}개 · 할 일 ${state.todos.length}개 · 일정 ${state.events.length}개`),
          h('p', { class:'muted' }, state.settings.lastExport ? `마지막 내보내기: ${fmtStamp(state.settings.lastExport)}` : '아직 내보낸 적이 없습니다.'),
          h('div', { class:'row' }, btn('JSON 내보내기', exportData), btn('JSON 불러오기', () => file.click(), 'btn sec'), file))),
        card('화면', null, h('div', { class:'stack' },
          h('div', { class:'seg', role:'group', 'aria-label':'테마' },
            Object.entries({ system:'시스템 따름', light:'라이트', dark:'다크' }).map(([k, label]) =>
              btn(label, () => { state.settings.theme = k; save('settings'); applyTheme(); render(); }, '', { 'aria-pressed':String(state.settings.theme === k) }))),
          btn('단축키 보기', openHelp, 'link')))))
  ];
}

/* ───────── 통합 검색 ───────── */
function openSearch() {
  if (document.querySelector('dialog[open]')) return;
  closeQuick();
  flushSync();
  const results = h('div', { class:'results', 'aria-live':'polite' });
  modal(close => {
    const run = q => {
      q = q.trim().toLowerCase();
      if (!q) return results.replaceChildren(empty('메모, 할 일, 일정을 함께 검색합니다.'));
      const has = (...parts) => parts.join('\n').toLowerCase().includes(q);
      const groups = [
        ['메모', activeMemos().filter(m => has(m.title, m.body, m.folder, ...m.tags)), m => [m.title || '제목 없음', memoPreview(m).slice(0, 40), () => openMemo(m.id)]],
        ['할 일', state.todos.filter(t => has(t.title, ...(t.tags || []))), t => [t.title, t.due ? fmtDate(t.due) : '마감일 없음', () => todoForm(t)]],
        ['일정', state.events.filter(e => has(e.title, e.note, ...(e.tags || []))), e => [e.title, fmtDate(eventStartDay(e)), () => { calUI.selected = eventStartDay(e); go('calendar'); eventForm(e); }]]
      ];
      const nodes = groups.filter(g => g[1].length).map(([name, list, map]) => h('div', { class:'section' },
        h('h3', null, `${name} ${list.length}`),
        list.slice(0, 30).map(x => {
          const [title, sub, open] = map(x);
          return h('div', { class:'item' }, h('button', { type:'button', class:'main', onclick:() => { close(); open(); } },
            h('span', { class:'ttl' }, title), h('span', { class:'meta' }, sub)));
        })));
      results.replaceChildren(...(nodes.length ? nodes : [empty('검색 결과가 없습니다.')]));
    };
    const input = h('input', { type:'search', placeholder:'통합 검색', 'aria-label':'통합 검색', oninput:e => run(e.target.value) });
    run('');
    return h('form', { onsubmit:e => e.preventDefault() }, h('h2', { class:'sr' }, '통합 검색'), input, results, h('div', { class:'actions' }, btn('닫기', close, 'btn sec')));
  });
}

/* ───────── 빠른 입력 ───────── */
const quickEl = $id('quick'), quickInput = $id('quickInput'), quickPrevEl = $id('quickPreview'), quickTypeEl = $id('quickType');
const quickUI = { open:false, type:null, opener:null };
const QUICK_TYPES = ['todo', 'event', 'memo'];
function quickSummary(q) {
  const parts = [];
  if (q.date) parts.push(`${fmtDate(q.date)}${q.time ? ' ' + q.time : q.type === 'event' ? ' 종일' : ''}`);
  else if (q.time) parts.push(q.time);
  if (q.repeat) parts.push(`↻ ${REPEAT[q.repeat]}${q.repeat === 'weekly' && q.repeatWeekday !== null ? ' ' + WD[q.repeatWeekday] + '요일' : ''}`);
  if (q.reminderOffsetMin !== null) parts.push(`알림 ${offsetLabel(q.reminderOffsetMin)}`);
  if (q.priority === 'high' && q.type === 'todo') parts.push(q.urgent ? '우선순위 상' : '우선순위 상');
  if (q.folder) parts.push(`폴더 ${q.folder}`);
  if (q.tags.length) parts.push(q.tags.map(t => '#' + t).join(' '));
  return parts.join(' · ');
}
function updateQuick() {
  const text = quickInput.value;
  const p = parseQuick(text, new Date());
  const type = quickUI.type || p.type;
  quickTypeEl.replaceChildren(...QUICK_TYPES.map(k => btn(KIND[k].label, () => { quickUI.type = k; updateQuick(); quickInput.focus(); }, 'chip', { 'aria-pressed':String(k === type), tabindex:'-1' })));
  if (!text.trim()) { quickPrevEl.replaceChildren(h('span', { class:'muted' }, '입력하면 해석 결과가 여기에 보입니다. 예: 내일 오후 3시 팀 회의 30분 전 알림 #업무')); return; }
  const sum = quickSummary({ ...p, type });
  quickPrevEl.replaceChildren(...[
    h('div', null, h('b', null, KIND[type].label), ' · ', p.title ? `“${p.title}”` : h('span', { class:'late-text' }, '제목이 없습니다'), sum && ` · ${sum}`),
    p.ambiguities.length ? h('ul', null, p.ambiguities.map(a => h('li', null, `· ${a}`))) : null].filter(Boolean));
}
function openQuick() {
  if (document.querySelector('dialog[open]')) return;
  if (!quickUI.open) quickUI.opener = document.activeElement;
  quickUI.open = true; quickUI.type = null; quickEl.hidden = false; quickInput.value = '';
  updateQuick(); quickInput.focus();
}
function closeQuick(restore = true) {
  if (!quickUI.open) return;
  quickUI.open = false; quickEl.hidden = true;
  if (restore) quickUI.opener?.focus?.();
}
function saveQuick() {
  const p = parseQuick(quickInput.value, new Date());
  const res = applyQuick(p, quickUI.type ? { type:quickUI.type } : {});
  if (!res.ok) { toast('제목을 입력해 주세요.'); return; }
  if (hasReminder(res.type, res.item.id) && notifyPermission() === 'default') requestNotifyPermission();
  closeQuick();
  render();
  toast(res.reminderError ? `저장했습니다. 알림은 설정하지 못했습니다. ${remError([res.reminderError])}` : `${KIND[res.type].label}${res.type === 'memo' ? '를' : '을'} 저장했습니다.`);
}
quickInput.addEventListener('input', updateQuick);
quickInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { if (e.isComposing || e.keyCode === 229) return; e.preventDefault(); saveQuick(); }
  else if (e.key === 'Tab') {
    e.preventDefault();
    const cur = quickUI.type || parseQuick(quickInput.value, new Date()).type;
    quickUI.type = QUICK_TYPES[(QUICK_TYPES.indexOf(cur) + (e.shiftKey ? 2 : 1)) % 3];
    updateQuick();
  } else if (e.key === 'Escape') { e.preventDefault(); closeQuick(); }
});
addEventListener('pointerdown', e => { if (quickUI.open && !e.target.closest('#quick') && !e.target.closest('#quickBtn')) closeQuick(false); });
$id('quickSave').addEventListener('click', saveQuick);
$id('quickClose').addEventListener('click', () => closeQuick());
$id('quickBtn').addEventListener('click', () => quickUI.open ? closeQuick() : openQuick());
$id('helpBtn').addEventListener('click', openHelp);
document.querySelectorAll('.searchBtn').forEach(b => b.addEventListener('click', openSearch));

/* ───────── 단축키 ───────── */
function openHelp() {
  if (document.querySelector('dialog[open]')) return;
  closeQuick();
  const rows = [['Ctrl+K 또는 /', '빠른 입력'], ['Ctrl+F', '통합 검색'], ['G 다음 T', '오늘'], ['G 다음 M', '메모'], ['G 다음 D', '할 일'], ['G 다음 C', '캘린더'], ['G 다음 R', '회고'], ['G 다음 I', '알림함'], ['N', '현재 화면에서 새 항목'], ['Esc', '대화상자나 입력창 닫기'], ['?', '이 도움말']];
  modal(close => h('div', { class:'dlgbody' }, h('h2', null, '단축키'),
    h('table', { class:'kbd-table' }, h('tbody', null, rows.map(([k, d]) => h('tr', null, h('td', null, h('kbd', null, k)), h('td', null, d))))),
    h('p', { class:'muted' }, '입력란에 커서가 있을 때는 한 글자 단축키가 동작하지 않습니다.'),
    h('div', { class:'actions' }, btn('닫기', close))));
}
function newItem() {
  if (current === 'memo') { discardIfBlank(memoUI.selected); createMemo(); }
  else if (current === 'calendar') eventForm(null, calUI.selected);
  else todoForm(null, current === 'today' ? { due:today() } : {});
}
let gAt = 0;
addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && !e.altKey && (e.code === 'KeyK' || e.key.toLowerCase() === 'k')) { e.preventDefault(); quickUI.open ? closeQuick() : openQuick(); return; }
  if (mod && !e.altKey && (e.code === 'KeyF' || e.key.toLowerCase() === 'f')) { e.preventDefault(); openSearch(); return; }
  if (e.key === 'Escape') { if (quickUI.open) { e.preventDefault(); closeQuick(); } return; }
  if (mod || e.altKey || e.isComposing) return;
  if (isTyping(e.target) || e.target?.closest?.('dialog') || document.querySelector('dialog[open]') || quickUI.open) return; // 입력 중에는 한 글자 단축키를 쓰지 않음
  if (e.key === '/') { e.preventDefault(); openQuick(); return; }
  if (e.key === '?') { e.preventDefault(); openHelp(); return; }
  if (gAt && Date.now() - gAt < 1500) {
    gAt = 0;
    const dest = { KeyT:'today', KeyM:'memo', KeyD:'todo', KeyC:'calendar', KeyR:'review', KeyI:'inbox', KeyS:'settings' }[e.code];
    if (dest) { e.preventDefault(); go(dest); }
    return;
  }
  if (e.code === 'KeyG') { gAt = Date.now(); return; }
  if (e.code === 'KeyN') { e.preventDefault(); newItem(); }
});

/* ───────── 라우팅 ───────── */
const VIEWS = { today:viewToday, memo:viewMemo, todo:viewTodo, calendar:viewCalendar, review:viewReview, inbox:viewInbox, settings:viewSettings };
const route = () => Object.hasOwn(VIEWS, location.hash.slice(1)) ? location.hash.slice(1) : 'today';
let current = null, renderedDay = today();

function render() {
  const name = route();
  if (current === 'memo' && name !== 'memo') { flushSync(); discardIfBlank(memoUI.selected); if (!memoById(memoUI.selected)) memoUI.selected = null; }
  current = name;
  renderedDay = today();
  riCache = null;
  document.querySelectorAll('nav a').forEach(a => a.getAttribute('href') === '#' + name ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  document.querySelectorAll('.js-bell').forEach(a => name === 'inbox' ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  $dash.classList.toggle('norail', name !== 'today');
  $rail.hidden = name !== 'today';
  $app.replaceChildren(...VIEWS[name]().filter(Boolean));
  if (name === 'today') $rail.replaceChildren(timelinePanel());
  if (name === 'calendar' && calUI.mode === 'week') { // 선택한 요일 열이 보이도록 가로 위치를 맞춘다
    const s = $app.querySelector('.wk-scroll'), col = $app.querySelector('.wk-col.sel');
    if (s) { s.scrollTop = calUI.wkTop; if (col) s.scrollLeft = Math.max(0, col.offsetLeft - 44); }
  }
  updateBadges();
}
function go(name) {
  if (route() !== name) history.pushState(null, '', '#' + name);
  render();
}
function navigated() { render(); $app.focus?.({ preventScroll:true }); window.scrollTo?.(0, 0); }

addEventListener('hashchange', navigated);
addEventListener('popstate', navigated);
addEventListener('pagehide', flushSync);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
// 다른 탭에서 바뀐 데이터를 반영해 덮어쓰기를 막는다
addEventListener('storage', e => { if (e.key === null || Object.values(KEYS).includes(e.key)) { load(); applyTheme(); render(); } });
// 자정이 지나면 오늘 표시 갱신
const refreshDay = () => { if (renderedDay !== today() && !document.querySelector('dialog') && !isTyping(document.activeElement)) render(); };
setInterval(refreshDay, 60000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushSync(); else refreshDay(); });

/* ───────── 알림 이벤트 연결 (한 번만 구독) ───────── */
onReminder(evt => {
  if (!evt.silent) showReminderCard(evt.reminder); // 방해 금지 중에는 카드·소리 없이 알림함에만 쌓인다
  deliverReminder(evt, r => openReminderTarget(r));
  updateBadges();
});
onMissed(() => updateBadges()); // 오늘 화면의 놓친 알림 카드는 'changed' 이벤트로 갱신
onDndEnd(({ count }) => showDndBanner(count));
onBriefing(({ data }) => briefingModal(data));
onRemindersChanged(() => {
  riCache = null; updateBadges();
  if ((current === 'today' || current === 'inbox') && !isTyping(document.activeElement)) render();
});
const onReady = fn => document.readyState === 'complete' ? fn() : addEventListener('load', fn);

load();
reconcileReminders();
applyTheme();
render();
setTimeout(startScheduler, 0); // UI가 onReminder 등을 구독한 뒤 첫 검사가 돌도록 한 틱 미룸
onReady(() => { const b = consumeBriefing({ startup:true }); if (b) briefingModal(b); }); // 하루 첫 실행의 아침 브리핑
if (loadProblem) toast('일부 저장 데이터를 읽지 못했습니다. 원본은 별도 보관했으니 백업 파일이 있으면 불러와 주세요.');

</script>
